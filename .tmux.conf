# Use Ctrl+Space as the prefix instead of Ctrl+B.
unbind-key C-b
set-option -g prefix C-Space
bind-key C-Space send-prefix

# Navigate panes with prefix + Vim motion keys (arrow keys still work).
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Show the status bar only when the session has multiple windows.
set-option -g status off
set-hook -g window-linked 'set-option -F status "#{?#{>:#{session_windows},1},on,off}"'
set-hook -g window-unlinked 'set-option -F status "#{?#{>:#{session_windows},1},on,off}"'
# Also update the current session when this file is reloaded.
if-shell -F '#{session_name}' 'set-option -F status "#{?#{>:#{session_windows},1},on,off}"'
